@if (isLoadingInitial()) {
  <app-loading-label label="Loading photos..." i18n-label="@@imageListPage.loading"></app-loading-label>
} @else if (loadError() && !items().length) {
  <app-loading-label [label]="loadError()!" mode="error"></app-loading-label>
} @else {
  <app-image-list
    [images]="items()"
    (imageSelected)="openImage($event)"
    (loadMoreRequested)="loadMore()"
  ></app-image-list>

  @if (isLoadingMore()) {
    <app-loading-label
      class="image-list-page__loading"
      label="Loading more photos..."
      i18n-label="@@imageListPage.loadingMore"
    ></app-loading-label>
  } @else if (loadError()) {
    <app-loading-label [label]="loadError()!" mode="error"></app-loading-label>
  }
}
