
   @if (image() === null) {
    <app-loading-label
      label="Loading photo details..."
      i18n-label="@@photoDetailsPage.loading"
    ></app-loading-label>
  } @else if (image(); as currentImage) {
    <app-image-card class="photo-details-page__image" [image]="currentImage"></app-image-card>

    <div class="photo-details-page__actions">
      <app-button
        class="photo-details-page__remove"
        [disabled]="!isFavorite()"
        variant="primary"
        (pressed)="removeFromFavorites()"
      >
        <ng-container i18n="@@photoDetailsPage.removeFromFavorites">Remove from favorites</ng-container>
      </app-button>
    </div>
  } @else {
    <app-loading-label
      class="photo-details-page__empty"
      label="This photo could not be found."
      i18n-label="@@photoDetailsPage.notFound"
      mode="empty"
    ></app-loading-label>
  }
